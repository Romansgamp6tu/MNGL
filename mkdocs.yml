      - Быстрый старт: 2d/quick-start.md
      - Анимация по атласу: 2d/sprite-animation.md
      - Текст: 2d/text-rendering.md
      - Рендер в текстуру: 2d/render-to-texture.md
      - Координаты и view: 2d/coordinates-and-view.md
      - Произвольная геометрия: 2d/geometry.md
      - SVG: 2d/svg.md
      - Трансформации: 2d/transforms.md
      - Hit testing: 2d/hit-testing.md
