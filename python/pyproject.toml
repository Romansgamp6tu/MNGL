[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mngl-cli"
version = "0.1.0"
description = "Simple Python API for MNGL trees and live GUI control"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mngl-python = "mngl_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mngl_cli*"]
