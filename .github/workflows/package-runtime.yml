name: Package MNGL runtime

on:
  push:
    branches: [main, "V-*"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mngl-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: [self-hosted, linux, x64]
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Choose package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0+ci.${GITHUB_SHA:0:12}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version such as 1.2.3; got: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  runtime-linux:
    needs: version
    runs-on: [self-hosted, linux, x64]
    container:
      image: node:24-trixie
      options: --user 0:0
    defaults:
      run:
        shell: bash
    timeout-minutes: 180
    steps:
      - name: Check out MNGL
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check out pinned glslang
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/glslang
          ref: e1b562a8bed273a02f30b59b66a5d499793cede5
          path: upstream/glslang
          submodules: recursive
          persist-credentials: false

      - name: Check out pinned SDL_shadercross
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL_shadercross
          ref: 1ff05bec573988a98ef9e0260b4da44f512b8367
          path: upstream/SDL_shadercross
          submodules: recursive
          persist-credentials: false

      - name: Install Linux runtime build tools
        run: |
          apt-get update
          apt-get install --yes sudo build-essential cmake ninja-build git pkg-config python3 bison flex patchelf binutils libjson-perl libvulkan-dev libfreetype-dev libxrandr-dev gh

      - name: Set up pinned SDL3 and SDL3_image
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.18
          version-sdl-image: 3.4.8
          build-type: Release
          cmake-generator: Ninja
          install-linux-dependencies: true

      - name: Fetch pinned glslang dependencies
        working-directory: upstream/glslang
        run: python3 update_glslang_sources.py

      - name: Build runtime package on Linux x86_64
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
          PKG_CONFIG_PATH: ${{ steps.sdl.outputs.prefix }}/lib/pkgconfig
        run: bash scripts/package-runtime-linux.sh

      - name: Upload Linux runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: mngl-runtime-linux-x64-${{ needs.version.outputs.value }}
          path: mngl-runtime-linux-x64-*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Restore runner workspace ownership
        if: always()
        run: |
          runner_uid="$(stat -c '%u' "$RUNNER_TEMP/_github_workflow/event.json")"
          runner_gid="$(stat -c '%g' "$RUNNER_TEMP/_github_workflow/event.json")"
          chown -R "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  publish-release:
    needs: [version, runtime-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - name: Download Linux runtime package
        uses: actions/download-artifact@v4
        with:
          pattern: mngl-runtime-linux-*
          path: release-assets
          merge-multiple: true

      - name: Attach Linux runtime package to the GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const tag_name = context.ref.replace("refs/tags/", "");

            let release;
            for (let attempt = 0; attempt < 20; attempt++) {
              try {
                ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tag_name }));
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  ({ data: release } = await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name,
                    name: "MNGL " + tag_name,
                    draft: false,
                    prerelease: tag_name.includes("-"),
                  }));
                  break;
                } catch (createError) {
                  if (createError.status !== 422 || attempt === 19) throw createError;
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                }
              }
            }
            if (!release) throw new Error("Could not find or create release " + tag_name);
            ({ data: release } = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: "MNGL " + tag_name,
              prerelease: tag_name.includes("-"),
            }));

            const files = fs.readdirSync("release-assets").filter((name) => name.endsWith(".tar.gz"));
            if (files.length !== 1) throw new Error("Expected one Linux runtime package, found " + files.length);
            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
            });
            for (const assetName of files) {
              const existing = existingAssets.find((asset) => asset.name === assetName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }
              const assetPath = path.join("release-assets", assetName);
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: assetName,
                data,
                headers: {
                  "content-type": "application/gzip",
                  "content-length": String(data.length),
                },
              });
            }

      - name: Clean up downloaded package
        if: always()
        run: rm -rf release-assets
