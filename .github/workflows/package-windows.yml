name: Package MNGL Linux development kit

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Choose package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0+ci.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version such as 1.2.3; got: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-package:
    if: ${{ false }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Windows package is paused until a Windows runner is available
        run: echo "Skipped"

  build-linux-package:
    needs: version
    runs-on: [self-hosted, linux, x64]
    container:
      image: node:24-bookworm
      options: --user 0:0
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install Linux package tools
        run: |
          apt-get update
          apt-get install --yes sudo build-essential cmake ninja-build git pkg-config python3 libfreetype-dev

      - name: Set up pinned SDL3 and SDL3_image
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.18
          version-sdl-image: 3.4.8
          build-type: Release
          cmake-generator: Ninja
          install-linux-dependencies: true

      - name: Configure Linux package
        env:
          MNGL_PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          MNGL_PACKAGE_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: |
          cmake -S . -B build-devel-linux -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SDL_PREFIX" \
            -DMNGL_BUILD_LINUX_DEVEL_PACKAGE=ON \
            "-DMNGL_PACKAGE_VERSION=$MNGL_PACKAGE_VERSION" \
            "-DMNGL_PACKAGE_BRANCH=$MNGL_PACKAGE_BRANCH"

      - name: Build package libraries
        run: |
          cmake --build build-devel-linux --target mngl_imgui --parallel 4
          cmake --build build-devel-linux --target SDL3_mixer-shared --parallel 4

      - name: Create Linux development tarball
        run: cpack --config build-devel-linux/CPackConfig.cmake -G TGZ

      - name: Test installed Linux package from a consumer project
        env:
          MNGL_PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: |
          sdk="$PWD/build-devel-linux/package-consumer-sdk"
          mkdir -p "$sdk"
          tar -xzf "build-devel-linux/packages/mngl-devel-linux-x64-${MNGL_PACKAGE_VERSION}.tar.gz" -C "$sdk"
          sdk="$sdk/mngl-devel-linux-x64-${MNGL_PACKAGE_VERSION}"
          cmake -S tests/package-consumer -B build-devel-linux/package-consumer -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$sdk;$SDL_PREFIX"
          cmake --build build-devel-linux/package-consumer --parallel 4
          LD_LIBRARY_PATH="$sdk/lib:$SDL_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build-devel-linux/package-consumer --output-on-failure

      - name: Save package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mngl-devel-linux-x64-${{ needs.version.outputs.value }}
          path: build-devel-linux/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Restore runner workspace ownership
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  build-macos-package:
    if: ${{ false }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            cmake_arch: arm64
            package_arch: arm64
          - runner: macos-15-intel
            cmake_arch: x86_64
            package_arch: x64
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: macOS packages are paused until native runners are available
        run: echo "Skipped"

  publish-release:
    needs: [version, build-linux-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - name: Download Linux development package
        uses: actions/download-artifact@v4
        with:
          pattern: mngl-devel-linux-*
          path: release-assets
          merge-multiple: true

      - name: Publish Linux package on GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const tag_name = context.ref.replace("refs/tags/", "");
            const files = fs.readdirSync("release-assets").filter((name) => name.endsWith(".tar.gz"));
            if (files.length !== 1) {
              throw new Error("Expected one Linux development package, found " + files.length);
            }

            let release;
            for (let attempt = 0; attempt < 20; attempt++) {
              try {
                ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tag_name }));
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  ({ data: release } = await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name,
                    name: "MNGL " + tag_name,
                    draft: false,
                    prerelease: tag_name.includes("-"),
                  }));
                  break;
                } catch (createError) {
                  if (createError.status !== 422 || attempt === 19) throw createError;
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                }
              }
            }
            if (!release) throw new Error("Could not find or create release " + tag_name);
            ({ data: release } = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: "MNGL " + tag_name,
              prerelease: tag_name.includes("-"),
            }));

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
            });
            for (const assetName of files) {
              const existing = existingAssets.find((asset) => asset.name === assetName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }

              const assetPath = path.join("release-assets", assetName);
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: assetName,
                data,
                headers: {
                  "content-type": "application/gzip",
                  "content-length": String(data.length),
                },
              });
            }

      - name: Clean up downloaded package
        if: always()
        run: rm -rf release-assets
