name: Package MNGL development kits

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Choose package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0+ci.${GITHUB_SHA:0:12}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version such as 1.2.3; got: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-package:
    needs: version
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Configure Windows package
        shell: pwsh
        env:
          MNGL_PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          MNGL_PACKAGE_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
        run: cmake -S . -B build-devel-windows -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=OFF -DMNGL_BUILD_MOD_EXAMPLE=OFF -DMNGL_BUILD_WINDOWS_DEVEL_PACKAGE=ON "-DMNGL_PACKAGE_VERSION=$env:MNGL_PACKAGE_VERSION" "-DMNGL_PACKAGE_BRANCH=$env:MNGL_PACKAGE_BRANCH"

      - name: Build package libraries
        run: cmake --build build-devel-windows --config Release --target mngl_imgui SDL3_mixer-shared --parallel 4

      - name: Create Windows development ZIP
        run: cpack --config build-devel-windows/CPackConfig.cmake -C Release -G ZIP

      - name: Upload Windows development package
        uses: actions/upload-artifact@v4
        with:
          name: mngl-devel-windows-x64-${{ needs.version.outputs.value }}
          path: build-devel-windows/packages/*.zip
          if-no-files-found: error
          retention-days: 1

  build-linux-package:
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: node:24-trixie
      options: --user 0:0
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install Linux package tools
        run: |
          apt-get update
          apt-get install --yes sudo build-essential cmake ninja-build git pkg-config python3 libfreetype-dev gh

      - name: Set up pinned SDL3 and SDL3_image
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.18
          version-sdl-image: 3.4.8
          build-type: Release
          cmake-generator: Ninja
          install-linux-dependencies: true

      - name: Configure Linux package
        env:
          MNGL_PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          MNGL_PACKAGE_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: |
          cmake -S . -B build-devel-linux -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SDL_PREFIX" \
            -DMNGL_BUILD_LINUX_DEVEL_PACKAGE=ON \
            "-DMNGL_PACKAGE_VERSION=$MNGL_PACKAGE_VERSION" \
            "-DMNGL_PACKAGE_BRANCH=$MNGL_PACKAGE_BRANCH"

      - name: Build package libraries
        run: |
          cmake --build build-devel-linux --target mngl_imgui --parallel 4
          cmake --build build-devel-linux --target SDL3_mixer-shared --parallel 4

      - name: Create Linux development tarball
        run: cpack --config build-devel-linux/CPackConfig.cmake -G TGZ

      - name: Test installed Linux package from a consumer project
        env:
          MNGL_PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: |
          sdk="$PWD/build-devel-linux/package-consumer-sdk"
          mkdir -p "$sdk"
          tar -xzf "build-devel-linux/packages/mngl-devel-linux-x64-${MNGL_PACKAGE_VERSION}.tar.gz" -C "$sdk"
          sdk="$sdk/mngl-devel-linux-x64-${MNGL_PACKAGE_VERSION}"
          cmake -S tests/package-consumer -B build-devel-linux/package-consumer -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$sdk;$SDL_PREFIX"
          cmake --build build-devel-linux/package-consumer --parallel 4
          LD_LIBRARY_PATH="$sdk/lib:$SDL_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build-devel-linux/package-consumer --output-on-failure

      - name: Save package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mngl-devel-linux-x64-${{ needs.version.outputs.value }}
          path: build-devel-linux/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Restore runner workspace ownership
        if: always()
        run: |
          runner_workspace_parent="$(dirname "$GITHUB_WORKSPACE")"
          runner_uid="$(stat -c '%u' "$runner_workspace_parent")"
          runner_gid="$(stat -c '%g' "$runner_workspace_parent")"
          chown -R "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  build-macos-package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            cmake_arch: arm64
            package_arch: arm64
          - runner: macos-15-intel
            cmake_arch: x86_64
            package_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install macOS package dependencies
        run: brew install ninja freetype

      - name: Set up pinned SDL3 and SDL3_image
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.18
          version-sdl-image: 3.4.8
          build-type: Release
          cmake-generator: Ninja
          install-linux-dependencies: true

      - name: Configure macOS package
        env:
          MNGL_PACKAGE_VERSION: ${{ needs.version.outputs.value }}
          MNGL_PACKAGE_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || 'main' }}
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
          CMAKE_ARCH: ${{ matrix.cmake_arch }}
        run: cmake -S . -B build-devel-macos -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$CMAKE_ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 "-DCMAKE_PREFIX_PATH=$SDL_PREFIX;$(brew --prefix)" -DBUILD_TESTING=OFF -DMNGL_BUILD_MOD_EXAMPLE=OFF -DMNGL_BUILD_MACOS_DEVEL_PACKAGE=ON "-DMNGL_PACKAGE_VERSION=$MNGL_PACKAGE_VERSION" "-DMNGL_PACKAGE_BRANCH=$MNGL_PACKAGE_BRANCH"

      - name: Build package libraries
        run: cmake --build build-devel-macos --target mngl_imgui SDL3_mixer-shared --parallel 4

      - name: Create macOS development tarball
        run: cpack --config build-devel-macos/CPackConfig.cmake -G TGZ

      - name: Upload macOS development package
        uses: actions/upload-artifact@v4
        with:
          name: mngl-devel-macos-${{ matrix.package_arch }}-${{ needs.version.outputs.value }}
          path: build-devel-macos/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: [version, build-package, build-linux-package, build-macos-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux development package
        uses: actions/download-artifact@v4
        with:
          pattern: mngl-devel-*
          path: release-assets
          merge-multiple: true

      - name: Publish Linux package on GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const tag_name = context.ref.replace("refs/tags/", "");
            const files = fs.readdirSync("release-assets").filter((name) => name.endsWith(".tar.gz") || name.endsWith(".zip"));
            if (files.length !== 4) {
              throw new Error("Expected four development packages, found " + files.length);
            }

            let release;
            for (let attempt = 0; attempt < 20; attempt++) {
              try {
                ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tag_name }));
                break;
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  ({ data: release } = await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name,
                    name: "MNGL " + tag_name,
                    draft: false,
                    prerelease: tag_name.includes("-"),
                  }));
                  break;
                } catch (createError) {
                  if (createError.status !== 422 || attempt === 19) throw createError;
                  await new Promise((resolve) => setTimeout(resolve, 1000));
                }
              }
            }
            if (!release) throw new Error("Could not find or create release " + tag_name);
            ({ data: release } = await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: "MNGL " + tag_name,
              prerelease: tag_name.includes("-"),
            }));

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
            });
            for (const assetName of files) {
              const existing = existingAssets.find((asset) => asset.name === assetName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }

              const assetPath = path.join("release-assets", assetName);
              const data = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: assetName,
                data,
                headers: {
                  "content-type": assetName.endsWith(".zip") ? "application/zip" : "application/gzip",
                  "content-length": String(data.length),
                },
              });
            }

      - name: Clean up downloaded package
        if: always()
        run: rm -rf release-assets
