name: Test MNGL platform matrix

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mngl-linux-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    # Only the Linux self-hosted runner is currently available.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    container:
      image: node:24-trixie
      options: --user 0:0
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Linux build tools
        run: |
          apt-get update
          apt-get install --yes sudo build-essential cmake ninja-build git pkg-config python3 libfreetype-dev gh

      - name: Set up pinned SDL3 and SDL3_image
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          version: 3.4.18
          version-sdl-image: 3.4.8
          build-type: Release
          cmake-generator: Ninja
          install-linux-dependencies: true

      - name: Configure Linux tests and demo
        env:
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: |
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$SDL_PREFIX" \
            -DBUILD_TESTING=ON -DMNGL_BUILD_MOD_EXAMPLE=ON

      - name: Build all targets
        run: cmake --build build --parallel 4

      - name: Run CTest suite
        env:
          SDL_PREFIX: ${{ steps.sdl.outputs.prefix }}
        run: |
          LD_LIBRARY_PATH="$SDL_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ctest --test-dir build --output-on-failure

      - name: Restore runner workspace ownership
        if: always()
        run: |
          runner_uid="$(stat -c '%u' "$RUNNER_TEMP/_github_workflow/event.json")"
          runner_gid="$(stat -c '%g' "$RUNNER_TEMP/_github_workflow/event.json")"
          chown -R "$runner_uid:$runner_gid" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
