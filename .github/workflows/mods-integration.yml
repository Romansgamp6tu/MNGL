name: Test MNGL mods

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure integration targets
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DMNGL_BUILD_MOD_EXAMPLE=ON

      - name: Build mod integration test and test modules
        run: cmake --build build --config Release --target mngl_mod_integration_test --parallel 4

      - name: Run mod integration test
        run: ctest --test-dir build -C Release --output-on-failure
