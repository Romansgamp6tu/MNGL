name: Validate documentation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mkdocs:
    runs-on: [self-hosted, linux, x64]
    container:
      image: python:3.12-bookworm
      options: --user 0:0
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation with strict link checking
        run: python -m mkdocs build --strict

      - name: Restore runner workspace ownership
        if: always()
        run: chown -R 1000:1000 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
